{{- if .Values.httpRoute.enabled -}}
{{- $fullName := include "penpot.fullname" . -}}
{{- $svcPort := .Values.frontend.service.port -}}
{{- $path := .Values.httpRoute.path -}}

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "penpot.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  {{- with .Values.httpRoute.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  {{- if .Values.httpRoute.hosts }}
  hostnames:
    {{- range .Values.httpRoute.hosts }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ $path | quote }}

      backendRefs:
        - name: {{ $fullName }}
          port: {{ $svcPort }}

{{- end }}
